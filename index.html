<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOSPRO | Latte Technology</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/564/564619.png">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/564/564619.png">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#050505">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #050505; 
            color: white; 
            margin: 0; 
            height: 100dvh; 
            overflow: hidden; 
            -webkit-tap-highlight-color: transparent; 
        }

        /* AMAGAT PER DEFECTE PER EVITAR PARPELLEIG */
        #lang-overlay, #main-app, #config-ui, #fall-overlay { 
            display: none; 
            position: fixed; 
            inset: 0; 
            width: 100%; 
            height: 100dvh; 
            flex-direction: column;
        }

        .bg-gradient-red { background: radial-gradient(circle, #ef4444 0%, #7f1d1d 100%); }
        .panic-active { animation: ring 1.5s infinite; }
        @keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 35px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        
        .footer-brand { 
            position: fixed; 
            bottom: 25px; 
            left: 0; 
            right: 0; 
            text-align: center; 
            opacity: 0.6; 
            font-size: 10px; 
            font-weight: 800; 
            text-transform: uppercase; 
            letter-spacing: 0.4em; 
            pointer-events: none; 
            color: #94a3b8;
            z-index: 5;
        }
        
        select option { background: #111; color: white; }
    </style>
</head>
<body class="text-center">

    <!-- 1. PANTALLA SELECCIÓ IDIOMA (NOMÉS PRIMER COP) -->
    <div id="lang-overlay" class="z-[100] bg-black items-center justify-center p-8">
        <h1 class="text-3xl font-extrabold mb-2 text-red-600 italic uppercase">SOSPRO</h1>
        <p class="text-slate-400 text-[10px] mb-8 font-bold uppercase tracking-widest text-center">Select Safety Region</p>
        <div class="grid grid-cols-1 gap-3 w-full max-w-xs mb-20">
            <button onclick="setLang('ca')" class="p-4 glass rounded-2xl font-bold border-l-4 border-red-600">Català (+34)</button>
            <button onclick="setLang('es')" class="p-4 glass rounded-2xl font-bold border-l-4 border-red-600">Español (+34)</button>
            <button onclick="setLang('en')" class="p-4 glass rounded-2xl font-bold border-l-4 border-blue-600">English (+44)</button>
            <button onclick="setLang('fr')" class="p-4 glass rounded-2xl font-bold border-l-4 border-blue-200">Français (+33)</button>
            <button onclick="setLang('de')" class="p-4 glass rounded-2xl font-bold border-l-4 border-yellow-600">Deutsch (+49)</button>
        </div>
        <div class="footer-brand">Latte Technology</div>
    </div>

    <!-- 2. PANTALLA PRINCIPAL -->
    <div id="main-app" class="z-10 p-6">
        <header class="flex justify-between items-center mb-2">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 bg-red-600 rounded-xl flex items-center justify-center font-black shadow-lg text-white">S</div>
                <span class="font-black text-xl tracking-tighter uppercase italic leading-none">SOS<span class="text-red-600">PRO</span></span>
            </div>
            <button onclick="toggleScreen('config-ui', true)" class="p-3 glass rounded-full active:scale-90 transition-transform text-lg">⚙️</button>
        </header>

        <div id="fall-banner" class="glass rounded-2xl p-2 text-center mb-2 border-red-500/30">
            <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest"><span id="txt-fall-label">CAIGUDES</span>: <span id="txt-fall-status">OFF</span></p>
        </div>

        <div class="flex-grow flex items-center justify-center py-4">
            <button onclick="executarSOS('sms')" class="bg-gradient-red w-48 h-48 rounded-full flex flex-col items-center justify-center panic-active border-8 border-white/5 relative z-10 active:scale-95 transition-transform shadow-2xl shadow-red-600/20">
                <span class="text-5xl mb-2">🚨</span>
                <span class="font-black text-xl tracking-widest uppercase italic" id="btn-alert-text">ALERTA</span>
            </button>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-24">
            <button onclick="triggerSiren()" id="siren-btn" class="glass p-4 rounded-[2rem] flex flex-col items-center gap-2 active:bg-white/10 transition-colors">
                <span class="text-2xl">🔊</span>
                <span class="text-[10px] font-bold uppercase tracking-widest" id="txt-siren">Sirena</span>
            </button>
            <button onclick="executarSOS('whatsapp')" class="glass p-4 rounded-[2rem] flex flex-col items-center gap-2 active:bg-white/10 transition-colors">
                <span class="text-2xl font-bold text-emerald-500">W</span>
                <span class="text-[10px] font-bold uppercase tracking-widest">WhatsApp</span>
            </button>
        </div>
        <div class="footer-brand">Latte Technology</div>
    </div>

    <!-- 3. CONFIGURACIÓ -->
    <div id="config-ui" class="z-[150] bg-[#050505] p-6">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-black text-red-500 italic uppercase tracking-tighter" id="txt-setup-title">Setup</h2>
            <button onclick="toggleScreen('config-ui', false)" class="text-slate-500 text-xs font-bold uppercase" id="txt-close">Tancar</button>
        </div>
        
        <div class="space-y-4 flex-grow overflow-y-auto pb-32">
            <!-- Contactes -->
            <div class="text-left space-y-2">
                <label class="text-[10px] font-bold text-slate-500 uppercase ml-2" id="txt-contacts-label">Fins a 5 Contactes</label>
                <input type="tel" id="tel1" class="w-full glass p-3 rounded-xl outline-none focus:border-red-500 text-sm font-mono">
                <input type="tel" id="tel2" class="w-full glass p-3 rounded-xl outline-none focus:border-red-500 text-sm font-mono">
                <input type="tel" id="tel3" class="w-full glass p-3 rounded-xl outline-none focus:border-red-500 text-sm font-mono">
                <input type="tel" id="tel4" class="w-full glass p-3 rounded-xl outline-none focus:border-red-500 text-sm font-mono">
                <input type="tel" id="tel5" class="w-full glass p-3 rounded-xl outline-none focus:border-red-500 text-sm font-mono">
            </div>

            <!-- Sensor -->
            <div class="glass p-4 rounded-2xl flex items-center justify-between mt-4">
                <div class="text-left">
                    <p class="font-bold text-sm" id="txt-fall-config-title">Detecció de caigudes</p>
                    <p class="text-[9px] text-slate-400 uppercase tracking-tighter">Accelerometer sensor</p>
                </div>
                <input type="checkbox" id="fall-toggle" onchange="toggleFallSensor()" class="w-6 h-6 accent-red-500">
            </div>

            <!-- IDIOMA A CONFIGURACIÓ -->
            <div class="text-left mt-6">
                <label class="text-[10px] font-bold text-slate-500 uppercase ml-2" id="txt-lang-label">Idioma / Language</label>
                <select onchange="setLang(this.value)" id="lang-select" class="w-full glass p-4 rounded-xl outline-none bg-black font-bold text-white appearance-none">
                    <option value="ca">Català</option>
                    <option value="es">Español</option>
                    <option value="en">English</option>
                    <option value="fr">Français</option>
                    <option value="de">Deutsch</option>
                </select>
            </div>
        </div>

        <div class="absolute bottom-0 left-0 right-0 p-6 bg-black flex flex-col items-center border-t border-white/5">
            <button onclick="guardarConfig()" class="w-full bg-red-600 p-5 rounded-2xl font-black uppercase italic active:bg-red-700 shadow-xl" id="btn-save">Desar</button>
            <div class="footer-brand relative bottom-0 mt-4">Latte Technology</div>
        </div>
    </div>

    <script>
        const translations = {
            ca: { prefix: "+34", alert: "ALERTA", fall_label: "Caigudes", on: "ACTIU", off: "OFF", siren: "Sirena", setup: "Setup", close: "Tancar", contacts: "Fins a 5 Contactes", fall_config: "Detecció de caigudes", lang: "Idioma", save: "Desar", msg: "EMERGÈNCIA! Ubicació: " },
            es: { prefix: "+34", alert: "ALERTA", fall_label: "Caídas", on: "ACTIVO", off: "OFF", siren: "Sirena", setup: "Configuración", close: "Cerrar", contacts: "Hasta 5 Contactos", fall_config: "Detección de caídas", lang: "Idioma", save: "Guardar", msg: "¡EMERGENCIA! Ubicación: " },
            en: { prefix: "+44", alert: "ALERT", fall_label: "Falls", on: "ACTIVE", off: "OFF", siren: "Siren", setup: "Setup", close: "Close", contacts: "Up to 5 Contacts", fall_config: "Fall Detection", lang: "Language", save: "Save", msg: "EMERGENCY! My location: " },
            fr: { prefix: "+33", alert: "ALERTE", fall_label: "Chutes", on: "ACTIF", off: "OFF", siren: "Sirène", setup: "Configuration", close: "Fermer", contacts: "Jusqu'à 5 Contacts", fall_config: "Détection de chute", lang: "Langue", save: "Enregistrer", msg: "URGENCE! Mon emplacement: " },
            de: { prefix: "+49", alert: "ALARM", fall_label: "Sturz", on: "AKTIV", off: "OFF", siren: "Sirene", setup: "Setup", close: "Schließen", contacts: "Bis zu 5 Kontakte", fall_config: "Sturzerkennung", lang: "Sprache", save: "Speichern", msg: "NOTFALL! Standort: " }
        };

        let currentLang = localStorage.getItem('sos_lang');
        let fallActive = JSON.parse(localStorage.getItem('sos_fall_active')) || false;
        let sirenInterval = null;

        // INICIALITZACIÓ IMMEDIATA SENSE ESPERAR A WINDOW.ONLOAD
        function initApp() {
            if (currentLang) {
                setLang(currentLang);
            } else {
                document.getElementById('lang-overlay').style.display = 'flex';
            }
        }

        function setLang(lang) {
            currentLang = lang;
            localStorage.setItem('sos_lang', lang);
            const t = translations[lang];

            // Traduccions d'elements
            document.getElementById('btn-alert-text').innerText = t.alert;
            document.getElementById('txt-fall-label').innerText = t.fall_label;
            document.getElementById('txt-siren').innerText = t.siren;
            document.getElementById('txt-setup-title').innerText = t.setup;
            document.getElementById('txt-close').innerText = t.close;
            document.getElementById('txt-contacts-label').innerText = t.contacts;
            document.getElementById('txt-fall-config-title').innerText = t.fall_config;
            document.getElementById('txt-lang-label').innerText = t.lang;
            document.getElementById('btn-save').innerText = t.save;
            document.getElementById('lang-select').value = lang;

            // Gestionar prefixos als camps buits
            for(let i=1; i<=5; i++) {
                let el = document.getElementById('tel'+i);
                let val = localStorage.getItem('sos_t'+i);
                if (!val || val === "" || ["+34","+44","+33","+49"].includes(val)) {
                    el.value = t.prefix;
                } else {
                    el.value = val;
                }
            }

            // Amagar selecció inicial si encara hi és
            document.getElementById('lang-overlay').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
            setTimeout(() => { document.getElementById('main-app').style.opacity = '1'; }, 10);
            updateUI();
        }

        function updateUI() {
            const t = translations[currentLang || 'ca'];
            document.getElementById('txt-fall-status').innerText = fallActive ? t.on : t.off;
            document.getElementById('fall-banner').style.borderColor = fallActive ? "rgba(239, 68, 68, 0.5)" : "rgba(255, 255, 255, 0.1)";
            document.getElementById('fall-toggle').checked = fallActive;
        }

        function toggleScreen(id, show) {
            document.getElementById(id).style.display = show ? 'flex' : 'none';
        }

        function guardarConfig() {
            for(let i=1; i<=5; i++) {
                localStorage.setItem('sos_t'+i, document.getElementById('tel'+i).value);
            }
            toggleScreen('config-ui', false);
        }

        function triggerSiren() {
            const btn = document.getElementById('siren-btn');
            if (sirenInterval) { clearInterval(sirenInterval); sirenInterval = null; btn.style.background = ""; return; }
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            sirenInterval = setInterval(() => {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(Math.random() * 800 + 1000, audioCtx.currentTime);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                btn.style.background = (btn.style.background === "") ? "rgba(239, 68, 68, 0.5)" : "";
            }, 120);
        }

        function executarSOS(tipus) {
            let nums = [];
            for(let i=1; i<=5; i++) { let n = localStorage.getItem('sos_t'+i); if(n && n.length > 5) nums.push(n); }
            if (nums.length === 0) return toggleScreen('config-ui', true);

            navigator.geolocation.getCurrentPosition(pos => {
                const mapUrl = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                const text = translations[currentLang].msg + mapUrl;
                const sep = /iPad|iPhone|iPod/.test(navigator.userAgent) ? "," : ";";
                if (tipus === 'sms') { window.location.href = `sms:${nums.join(sep)}?body=${encodeURIComponent(text)}`; } 
                else { window.location.href = `https://wa.me/?text=${encodeURIComponent(text)}`; }
            }, () => alert("GPS error."));
        }

        function toggleFallSensor() {
            fallActive = document.getElementById('fall-toggle').checked;
            localStorage.setItem('sos_fall_active', fallActive);
            updateUI();
        }

        // Executar inicialització
        initApp();
    </script>
</body>
</html>
