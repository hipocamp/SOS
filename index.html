<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOSPRO | Latte Technology</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/564/564619.png">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/564/564619.png">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#050505">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #050505; color: white; -webkit-tap-highlight-color: transparent; height: 100dvh; margin: 0; overflow: hidden; }
        
        /* Contenidors */
        .app-screen { position: fixed; inset: 0; display: none; flex-direction: column; padding: 24px; height: 100dvh; width: 100%; box-sizing: border-box; }
        
        .bg-gradient-red { background: radial-gradient(circle, #ef4444 0%, #7f1d1d 100%); }
        .panic-active { animation: ring 1.5s infinite; }
        @keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 35px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        
        .footer-brand { position: absolute; bottom: 25px; left: 0; right: 0; text-align: center; opacity: 0.7; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.4em; pointer-events: none; z-index: 10; color: #94a3b8; }
        
        @media (max-height: 650px) { #main-sos-btn { width: 160px; height: 180px; } }
    </style>
</head>
<body class="text-center">

    <!-- 1. PANTALLA IDIOMA (VISIBLE PER DEFECTE PER SEGURETAT) -->
    <div id="lang-overlay" class="app-screen z-[100] bg-black" style="display: flex;">
        <div class="flex-grow flex flex-col items-center justify-center">
            <h1 class="text-3xl font-extrabold mb-2 text-red-600 italic uppercase">SOSPRO</h1>
            <p class="text-slate-400 text-[10px] mb-8 font-bold uppercase tracking-widest text-center">Powered by Latte Technology</p>
            <div class="grid grid-cols-1 gap-3 w-full max-w-xs text-center">
                <button onclick="setLang('ca')" class="p-4 glass rounded-2xl font-bold border-l-4 border-red-600">Català (+34)</button>
                <button onclick="setLang('es')" class="p-4 glass rounded-2xl font-bold border-l-4 border-red-600">Español (+34)</button>
                <button onclick="setLang('en')" class="p-4 glass rounded-2xl font-bold border-l-4 border-blue-600">English (+44)</button>
                <button onclick="setLang('fr')" class="p-4 glass rounded-2xl font-bold border-l-4 border-blue-200">Français (+33)</button>
                <button onclick="setLang('de')" class="p-4 glass rounded-2xl font-bold border-l-4 border-yellow-600">Deutsch (+49)</button>
            </div>
        </div>
        <div class="footer-brand text-white">Latte Technology</div>
    </div>

    <!-- 2. PANTALLA PRINCIPAL -->
    <div id="main-app" class="app-screen">
        <header class="flex justify-between items-center mb-2">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 bg-red-600 rounded-xl flex items-center justify-center font-black shadow-lg text-white">S</div>
                <span class="font-black text-xl tracking-tighter uppercase italic">SOS<span class="text-red-600">PRO</span></span>
            </div>
            <button onclick="toggleConfig(true)" class="p-3 glass rounded-full text-lg">⚙️</button>
        </header>

        <div id="fall-banner" class="glass rounded-2xl p-2 text-center mb-2 border-red-500/30">
            <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest"><span id="txt-fall-label">CAIGUDES</span>: <span id="txt-fall-status">OFF</span></p>
        </div>

        <div class="flex-grow flex items-center justify-center">
            <button onclick="executarSOS('sms')" id="main-sos-btn" class="bg-gradient-red w-48 h-48 rounded-full flex flex-col items-center justify-center panic-active border-8 border-white/5 relative z-10 active:scale-95 transition-transform">
                <span class="text-5xl mb-2">🚨</span>
                <span class="font-black text-xl tracking-widest uppercase italic" id="btn-alert-text">ALERTA</span>
            </button>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-20 text-center">
            <button onclick="triggerSiren()" id="siren-btn" class="glass p-5 rounded-[2rem] flex flex-col items-center gap-2 transition-all">
                <span class="text-2xl">🔊</span>
                <span class="text-[10px] font-bold uppercase tracking-widest" id="txt-siren">Sirena</span>
            </button>
            <button onclick="executarSOS('whatsapp')" class="glass p-5 rounded-[2rem] flex flex-col items-center gap-2 transition-all">
                <span class="text-2xl font-bold text-emerald-500">W</span>
                <span class="text-[10px] font-bold uppercase tracking-widest">WhatsApp</span>
            </button>
        </div>
        <div class="footer-brand">Latte Technology</div>
    </div>

    <!-- 3. CONFIGURACIÓ -->
    <div id="config-ui" class="app-screen bg-[#050505] z-[150]">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-black text-red-500 italic uppercase" id="txt-setup-title">Setup</h2>
            <button onclick="toggleConfig(false)" class="text-slate-500 text-xs font-bold uppercase">Tancar</button>
        </div>
        <div class="space-y-4 flex-grow overflow-y-auto pb-32 text-left">
            <label class="text-[10px] font-bold text-slate-500 uppercase ml-2" id="txt-contacts-label">Contactes (5)</label>
            <input type="tel" id="tel1" class="w-full glass p-3 rounded-xl outline-none mb-1 focus:border-red-500 text-sm">
            <input type="tel" id="tel2" class="w-full glass p-3 rounded-xl outline-none mb-1 focus:border-red-500 text-sm">
            <input type="tel" id="tel3" class="w-full glass p-3 rounded-xl outline-none mb-1 focus:border-red-500 text-sm">
            <input type="tel" id="tel4" class="w-full glass p-3 rounded-xl outline-none mb-1 focus:border-red-500 text-sm">
            <input type="tel" id="tel5" class="w-full glass p-3 rounded-xl outline-none mb-1 focus:border-red-500 text-sm">
            
            <div class="glass p-4 rounded-2xl flex items-center justify-between mt-4">
                <div><p class="font-bold text-sm" id="txt-fall-config-title">Detecció de caigudes</p><p class="text-[9px] text-slate-400 uppercase tracking-tighter italic">Sensor d'impacte fort</p></div>
                <input type="checkbox" id="fall-toggle" onchange="toggleFallSensor()" class="w-6 h-6 accent-red-500">
            </div>
        </div>
        <div class="absolute bottom-0 left-0 right-0 p-6 bg-black flex flex-col items-center">
            <button onclick="guardarConfig()" class="w-full bg-red-600 p-5 rounded-2xl font-black uppercase italic" id="btn-save text-white">Desar</button>
            <div class="mt-6 mb-2 opacity-60 text-[9px] font-extrabold uppercase tracking-[0.4em]">Latte Technology</div>
        </div>
    </div>

    <script>
        const translations = {
            ca: { prefix: "+34", alert: "ALERTA", fall_label: "Caigudes", on: "ACTIU", off: "OFF", siren: "Sirena", setup: "Setup", close: "Tancar", contacts: "Fins a 5 Contactes", fall_config: "Detecció de caigudes", lang: "Idioma", save: "Desar", msg: "EMERGÈNCIA! Ubicació: " },
            es: { prefix: "+34", alert: "ALERTA", fall_label: "Caídas", on: "ACTIVO", off: "OFF", siren: "Sirena", setup: "Setup", close: "Cerrar", contacts: "Hasta 5 Contactos", fall_config: "Detección de caídas", lang: "Idioma", save: "Guardar", msg: "¡EMERGENCIA! Ubicación: " },
            en: { prefix: "+44", alert: "ALERT", fall_label: "Falls", on: "ACTIVE", off: "OFF", siren: "Siren", setup: "Setup", close: "Close", contacts: "Up to 5 Contacts", fall_config: "Fall Detection", lang: "Language", save: "Save", msg: "EMERGENCY! My location: " },
            fr: { prefix: "+33", alert: "ALERTE", fall_label: "Chutes", on: "ACTIF", off: "OFF", siren: "Sirène", setup: "Setup", close: "Fermer", contacts: "Jusqu'à 5 Contacts", fall_config: "Détection de chute", lang: "Langue", save: "Enregistrer", msg: "URGENCE! Mon emplacement: " },
            de: { prefix: "+49", alert: "ALARM", fall_label: "Sturz", on: "AKTIV", off: "OFF", siren: "Sirene", setup: "Setup", close: "Schließen", contacts: "Bis zu 5 Kontakte", fall_config: "Sturzerkennung", lang: "Sprache", save: "Speichern", msg: "NOTFALL! Standort: " }
        };

        let currentLang = localStorage.getItem('sos_lang');
        let fallActive = JSON.parse(localStorage.getItem('sos_fall_active')) || false;

        // EXECUCIÓ IMMEDIATA
        function init() {
            if (currentLang) {
                setLang(currentLang);
            } else {
                document.getElementById('lang-overlay').style.display = 'flex';
            }
        }

        function setLang(lang) {
            currentLang = lang;
            localStorage.setItem('sos_lang', lang);
            const t = translations[lang];

            // Traduccions
            document.getElementById('btn-alert-text').innerText = t.alert;
            document.getElementById('txt-fall-label').innerText = t.fall_label;
            document.getElementById('txt-siren').innerText = t.siren;
            document.getElementById('txt-setup-title').innerText = t.setup;
            document.getElementById('txt-contacts-label').innerText = t.contacts;
            document.getElementById('txt-fall-config-title').innerText = t.fall_config;
            document.getElementById('btn-save').innerText = t.save;

            for(let i=1; i<=5; i++) {
                let el = document.getElementById('tel'+i);
                let val = localStorage.getItem('sos_t'+i);
                el.value = (val && val !== "") ? val : t.prefix;
            }

            // Canvi de pantalles
            document.getElementById('lang-overlay').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
            setTimeout(() => { document.getElementById('main-app').style.opacity = '1'; }, 50);
            updateUI();
        }

        function updateUI() {
            const t = translations[currentLang || 'ca'];
            document.getElementById('txt-fall-status').innerText = fallActive ? t.on : t.off;
            document.getElementById('fall-banner').style.borderColor = fallActive ? "rgba(239, 68, 68, 0.5)" : "rgba(255, 255, 255, 0.1)";
            document.getElementById('fall-toggle').checked = fallActive;
        }

        function toggleConfig(show) { 
            document.getElementById('config-ui').style.display = show ? 'flex' : 'none';
        }

        function guardarConfig() {
            for(let i=1; i<=5; i++) {
                localStorage.setItem('sos_t'+i, document.getElementById('tel'+i).value);
            }
            toggleConfig(false);
        }

        function triggerSiren() {
            const btn = document.getElementById('siren-btn');
            if (window.sirenInterval) { clearInterval(window.sirenInterval); window.sirenInterval = null; btn.style.background = ""; return; }
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            window.sirenInterval = setInterval(() => {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(Math.random() * 600 + 1000, audioCtx.currentTime);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                btn.style.background = (btn.style.background === "") ? "rgba(239, 68, 68, 0.5)" : "";
            }, 120);
        }

        function executarSOS(tipus) {
            let nums = [];
            for(let i=1; i<=5; i++) { let n = localStorage.getItem('sos_t'+i); if(n && n.length > 5) nums.push(n); }
            if (nums.length === 0) return toggleConfig(true);

            navigator.geolocation.getCurrentPosition(pos => {
                const mapUrl = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                const text = translations[currentLang].msg + mapUrl;
                const sep = /iPad|iPhone|iPod/.test(navigator.userAgent) ? "," : ";";
                if (tipus === 'sms') { window.location.href = `sms:${nums.join(sep)}?body=${encodeURIComponent(text)}`; } 
                else { window.location.href = `https://wa.me/?text=${encodeURIComponent(text)}`; }
            }, () => alert("Activa el GPS."));
        }

        function toggleFallSensor() {
            fallActive = document.getElementById('fall-toggle').checked;
            localStorage.setItem('sos_fall_active', fallActive);
            updateUI();
        }

        // Executar inicialització
        init();
    </script>
</body>
</html>
