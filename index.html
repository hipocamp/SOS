<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOSPRO | Latte Technology</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/564/564619.png">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/564/564619.png">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#050505">
    <meta name="mobile-web-app-capable" content="yes">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #050505; color: white; -webkit-tap-highlight-color: transparent; height: 100dvh; margin: 0; overflow: hidden; }
        .bg-gradient-red { background: radial-gradient(circle, #ef4444 0%, #7f1d1d 100%); }
        .panic-active { animation: ring 1.5s infinite; }
        @keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 35px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .footer-brand { position: absolute; bottom: 25px; left: 0; right: 0; text-align: center; opacity: 0.7; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.4em; pointer-events: none; color: #94a3b8; }
        
        #update-banner { position: fixed; top: 20px; left: 20px; right: 20px; z-index: 1000; background: #2563eb; color: white; padding: 15px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: none; align-items: center; justify-content: space-between; }
        
        /* Amaguem les pantalles per defecte per evitar el parpelleig */
        #lang-overlay, #main-app, #config-ui, #fall-overlay { display: none; }
    </style>
</head>
<body class="text-center">

    <!-- AVÍS D'ACTUALITZACIÓ -->
    <div id="update-banner">
        <span id="txt-update-msg" class="text-xs font-bold uppercase tracking-tight text-left mr-2">Nova versió disponible!</span>
        <button onclick="window.location.reload()" class="bg-white text-blue-600 px-4 py-2 rounded-lg font-black text-[10px] uppercase">Actualitzar</button>
    </div>

    <!-- 1. PANTALLA IDIOMA (Amagada per defecte) -->
    <div id="lang-overlay" class="fixed inset-0 z-[100] bg-black flex-col items-center justify-center p-8">
        <h1 class="text-3xl font-extrabold mb-2 text-red-600 italic uppercase">SOSPRO</h1>
        <p class="text-slate-400 text-[10px] mb-8 font-bold uppercase tracking-widest text-center">Powered by Latte Technology</p>
        <div class="grid grid-cols-1 gap-3 w-full max-w-xs mb-20 text-center">
            <button onclick="setLang('ca')" class="p-4 glass rounded-2xl font-bold border-l-4 border-red-600">Català (+34)</button>
            <button onclick="setLang('es')" class="p-4 glass rounded-2xl font-bold border-l-4 border-red-600">Español (+34)</button>
            <button onclick="setLang('en')" class="p-4 glass rounded-2xl font-bold border-l-4 border-blue-600">English (+44)</button>
            <button onclick="setLang('fr')" class="p-4 glass rounded-2xl font-bold border-l-4 border-blue-200">Français (+33)</button>
            <button onclick="setLang('de')" class="p-4 glass rounded-2xl font-bold border-l-4 border-yellow-600">Deutsch (+49)</button>
        </div>
        <div class="footer-brand text-white">Latte Technology</div>
    </div>

    <!-- 2. PANTALLA PRINCIPAL (Amagada per defecte) -->
    <div id="main-app" class="h-screen flex flex-col p-6 relative">
        <header class="flex justify-between items-center mb-2">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 bg-red-600 rounded-xl flex items-center justify-center font-black shadow-lg text-white">S</div>
                <span class="font-black text-xl tracking-tighter uppercase italic">SOS<span class="text-red-600">PRO</span></span>
            </div>
            <button onclick="toggleConfig()" class="p-3 glass rounded-full text-lg">⚙️</button>
        </header>

        <div id="fall-banner" class="glass rounded-2xl p-2 text-center mb-2 border-red-500/30">
            <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest"><span id="txt-fall-label">CAIGUDES</span>: <span id="txt-fall-status">OFF</span></p>
        </div>

        <div class="flex-grow flex items-center justify-center py-4">
            <button onclick="executarSOS('sms')" class="bg-gradient-red w-48 h-48 rounded-full flex flex-col items-center justify-center panic-active border-8 border-white/5 relative z-10 active:scale-95 transition-transform">
                <span class="text-5xl mb-2">🚨</span>
                <span class="font-black text-xl tracking-widest uppercase italic" id="btn-alert-text">ALERTA</span>
            </button>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-24">
            <button onclick="triggerSiren()" id="siren-btn" class="glass p-4 rounded-[2rem] flex flex-col items-center gap-2">
                <span class="text-2xl">🔊</span>
                <span class="text-[10px] font-bold uppercase tracking-widest" id="txt-siren">Sirena</span>
            </button>
            <button onclick="executarSOS('whatsapp')" class="glass p-4 rounded-[2rem] flex flex-col items-center gap-2">
                <span class="text-2xl font-bold text-emerald-500">W</span>
                <span class="text-[10px] font-bold uppercase tracking-widest">WhatsApp</span>
            </button>
        </div>
        <div class="footer-brand">Latte Technology</div>
    </div>

    <!-- 3. CONFIGURACIÓ -->
    <div id="config-ui" class="fixed inset-0 z-[150] bg-[#050505] p-6 flex-col">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-black text-red-500 italic uppercase" id="txt-setup-title">Setup</h2>
            <button onclick="toggleConfig()" class="text-slate-500 text-xs font-bold uppercase" id="txt-close">Tancar</button>
        </div>
        <div class="space-y-4 flex-grow overflow-y-auto pb-32 text-left">
            <label class="text-[10px] font-bold text-slate-500 uppercase ml-2" id="txt-contacts-label">Contactes (5)</label>
            <input type="tel" id="tel1" class="w-full glass p-3 rounded-xl outline-none mb-2 focus:border-red-500 text-sm">
            <input type="tel" id="tel2" class="w-full glass p-3 rounded-xl outline-none mb-2 focus:border-red-500 text-sm">
            <input type="tel" id="tel3" class="w-full glass p-3 rounded-xl outline-none mb-2 focus:border-red-500 text-sm">
            <input type="tel" id="tel4" class="w-full glass p-3 rounded-xl outline-none mb-2 focus:border-red-500 text-sm">
            <input type="tel" id="tel5" class="w-full glass p-3 rounded-xl outline-none mb-2 focus:border-red-500 text-sm">
            
            <div class="glass p-4 rounded-2xl flex items-center justify-between mt-4">
                <div><p class="font-bold text-sm" id="txt-fall-config-title">Detecció de caigudes</p><p class="text-[9px] text-slate-400 uppercase">Accelerometer sensor</p></div>
                <input type="checkbox" id="fall-toggle" onchange="toggleFallSensor()" class="w-6 h-6 accent-red-500">
            </div>
        </div>
        <div class="absolute bottom-0 left-0 right-0 p-6 bg-black">
            <button onclick="guardarConfig()" class="w-full bg-red-600 p-5 rounded-2xl font-black uppercase italic" id="btn-save">Desar</button>
            <div class="footer-brand relative bottom-0 mt-4">Latte Technology</div>
        </div>
    </div>

    <script>
        const translations = {
            ca: { prefix: "+34", alert: "ALERTA", fall_label: "Caigudes", on: "ACTIU", off: "OFF", siren: "Sirena", setup: "Setup", close: "Tancar", contacts: "Fins a 5 Contactes", fall_config: "Detecció de caigudes", lang: "Idioma", save: "Desar", update: "Nova versió!", msg: "EMERGÈNCIA! Ubicació: " },
            es: { prefix: "+34", alert: "ALERTA", fall_label: "Caídas", on: "ACTIVO", off: "OFF", siren: "Sirena", setup: "Setup", close: "Cerrar", contacts: "Hasta 5 Contactos", fall_config: "Detección de caídas", lang: "Idioma", save: "Guardar", update: "¡Nueva versión!", msg: "¡EMERGENCIA! Ubicación: " },
            en: { prefix: "+44", alert: "ALERT", fall_label: "Falls", on: "ACTIVE", off: "OFF", siren: "Siren", setup: "Setup", close: "Close", contacts: "Up to 5 Contacts", fall_config: "Fall Detection", lang: "Language", save: "Save", update: "New version!", msg: "EMERGENCY! My location: " },
            fr: { prefix: "+33", alert: "ALERTE", fall_label: "Chutes", on: "ACTIF", off: "OFF", siren: "Sirène", setup: "Setup", close: "Fermer", contacts: "Jusqu'à 5 Contacts", fall_config: "Détection de chute", lang: "Langue", save: "Enregistrer", update: "Nouvelle version!", msg: "URGENCE! Mon emplacement: " },
            de: { prefix: "+49", alert: "ALARM", fall_label: "Sturz", on: "AKTIV", off: "OFF", siren: "Sirene", setup: "Setup", close: "Schließen", contacts: "Bis zu 5 Kontakte", fall_config: "Sturzerkennung", lang: "Sprache", save: "Speichern", update: "Neue Version!", msg: "NOTFALL! Standort: " }
        };

        let currentLang = localStorage.getItem('sos_lang');
        let fallActive = JSON.parse(localStorage.getItem('sos_fall_active')) || false;

        // LÒGICA DE CONTROL DE PANTALLES INICIALS
        window.onload = function() {
            if (currentLang) {
                setLang(currentLang, true); // True indica que ja estava guardat
            } else {
                document.getElementById('lang-overlay').style.display = 'flex';
            }
        };

        function setLang(lang, silent = false) {
            currentLang = lang;
            localStorage.setItem('sos_lang', lang);
            const t = translations[lang];

            // Traduir interfície
            document.getElementById('btn-alert-text').innerText = t.alert;
            document.getElementById('txt-fall-label').innerText = t.fall_label;
            document.getElementById('txt-siren').innerText = t.siren;
            document.getElementById('txt-setup-title').innerText = t.setup;
            document.getElementById('txt-close').innerText = t.close;
            document.getElementById('txt-contacts-label').innerText = t.contacts;
            document.getElementById('txt-fall-config-title').innerText = t.fall_config;
            document.getElementById('btn-save').innerText = t.save;
            document.getElementById('txt-update-msg').innerText = t.update;
            document.getElementById('lang-select').value = lang;

            for(let i=1; i<=5; i++) {
                let el = document.getElementById('tel'+i);
                let val = localStorage.getItem('sos_t'+i);
                el.value = (val && val !== "") ? val : t.prefix;
            }

            // Canviar pantalles
            document.getElementById('lang-overlay').style.display = 'none';
            const main = document.getElementById('main-app');
            main.style.display = 'flex';
            main.style.opacity = '1';

            updateUI();
        }

        function updateUI() {
            const t = translations[currentLang || 'ca'];
            document.getElementById('txt-fall-status').innerText = fallActive ? t.on : t.off;
            document.getElementById('fall-banner').style.borderColor = fallActive ? "rgba(239, 68, 68, 0.5)" : "rgba(255, 255, 255, 0.1)";
            document.getElementById('fall-toggle').checked = fallActive;
        }

        function toggleConfig() { 
            const ui = document.getElementById('config-ui');
            ui.style.display = (ui.style.display === 'none' || ui.style.display === '') ? 'flex' : 'none';
        }

        function guardarConfig() {
            for(let i=1; i<=5; i++) { localStorage.setItem('sos_t'+i, document.getElementById('tel'+i).value); }
            toggleConfig();
        }

        function triggerSiren() {
            const btn = document.getElementById('siren-btn');
            if (window.sirenInterval) { clearInterval(window.sirenInterval); window.sirenInterval = null; btn.style.background = ""; return; }
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            window.sirenInterval = setInterval(() => {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(Math.random() * 800 + 1000, audioCtx.currentTime);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                btn.style.background = (btn.style.background === "") ? "rgba(239, 68, 68, 0.5)" : "";
            }, 120);
        }

        function executarSOS(tipus) {
            let nums = [];
            for(let i=1; i<=5; i++) { let n = localStorage.getItem('sos_t'+i); if(n && n.length > 5) nums.push(n); }
            if (nums.length === 0) return toggleConfig();
            navigator.geolocation.getCurrentPosition(pos => {
                const mapUrl = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                const text = translations[currentLang].msg + mapUrl;
                const sep = /iPad|iPhone|iPod/.test(navigator.userAgent) ? "," : ";";
                if (tipus === 'sms') { window.location.href = `sms:${nums.join(sep)}?body=${encodeURIComponent(text)}`; } 
                else { window.location.href = `https://wa.me/?text=${encodeURIComponent(text)}`; }
            }, () => alert("Activa el GPS."));
        }

        function toggleFallSensor() {
            fallActive = document.getElementById('fall-toggle').checked;
            localStorage.setItem('sos_fall_active', fallActive);
            if (fallActive) {
                if (typeof DeviceMotionEvent.requestPermission === 'function') {
                    DeviceMotionEvent.requestPermission().then(resp => { if (resp == 'granted') window.addEventListener('devicemotion', handleMotion); });
                } else { window.addEventListener('devicemotion', handleMotion); }
            } else { window.removeEventListener('devicemotion', handleMotion); }
            updateUI();
        }

        function handleMotion(event) {
            const acc = event.accelerationIncludingGravity;
            if(!acc) return;
            const total = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
            if (total > 45) { /* SOS automàtic */ }
        }

        // SERVICE WORKER - ACTUALITZAT A V2
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE_NAME = 'sospro-v2';
                self.addEventListener('install', e => {
                    self.skipWaiting();
                    e.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll(['./', 'index.html'])));
                });
                self.addEventListener('activate', e => {
                    e.waitUntil(caches.keys().then(keys => Promise.all(keys.map(k => k !== CACHE_NAME && caches.delete(k)))));
                });
                self.addEventListener('fetch', e => {
                    e.respondWith(caches.match(e.request).then(res => res || fetch(e.request)));
                });
            `;
            const blob = new Blob([swCode], {type: 'application/javascript'});
            navigator.serviceWorker.register(URL.createObjectURL(blob)).then(reg => {
                reg.onupdatefound = () => {
                    const sw = reg.installing;
                    sw.onstatechange = () => {
                        if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                            document.getElementById('update-banner').style.display = 'flex';
                        }
                    };
                };
            });
        }
    </script>
</body>
</html>
