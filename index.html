<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOS EMERGÈNCIA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Icona de la App (Sirena vermella) -->
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/564/564619.png">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/564/564619.png">
    
    <!-- Configuració PWA per semblar una App nativa -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ef4444">

    <style>
        .panic-button {
            box-shadow: 0 0 50px rgba(239, 68, 68, 0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 30px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans overflow-hidden">

    <div class="max-w-md mx-auto h-screen flex flex-col items-center justify-center p-6 relative">
        
        <!-- PANTALLA PRINCIPAL -->
        <div id="main-ui" class="text-center fade-in w-full">
            <div class="mb-12">
                <h1 class="text-3xl font-black tracking-tighter text-red-500 uppercase italic">SOS Emergència</h1>
                <p class="text-slate-400 text-sm mt-2">Envia la teva ubicació GPS a la teva gent</p>
            </div>

            <!-- BOTÓ DE PÀNIC -->
            <button onclick="enviarUbicacio()" class="panic-button w-48 h-48 bg-red-600 rounded-full flex flex-col items-center justify-center border-8 border-red-500 active:scale-90 transition-transform mb-16 mx-auto">
                <span class="text-6xl mb-2">🚨</span>
                <span class="font-black text-xl tracking-widest">AVISAR</span>
            </button>

            <!-- OPCIONS D'ENVIAMENT -->
            <div class="grid grid-cols-1 gap-4 w-full px-4">
                <button onclick="executarSOS('whatsapp')" class="bg-emerald-600 hover:bg-emerald-500 p-5 rounded-3xl font-black uppercase text-sm shadow-xl flex items-center justify-center gap-3">
                    <span>📱 Enviar per WhatsApp</span>
                </button>
                <button onclick="executarSOS('sms')" class="bg-blue-600 hover:bg-blue-500 p-5 rounded-3xl font-black uppercase text-sm shadow-xl flex items-center justify-center gap-3">
                    <span>📩 Enviar per SMS</span>
                </button>
            </div>

            <!-- BOTÓ CONFIGURACIÓ -->
            <button onclick="toggleConfig()" class="mt-12 text-slate-500 text-xs font-bold uppercase tracking-widest flex items-center gap-2 mx-auto border-b border-slate-800 pb-1">
                ⚙️ Configurar Números
            </button>
        </div>

        <!-- PANTALLA CONFIGURACIÓ (MODAL) -->
        <div id="config-ui" class="hidden absolute inset-0 bg-slate-900 z-50 p-8 flex flex-col">
            <h2 class="text-2xl font-black mb-6 text-red-500 uppercase tracking-tight italic">Configuració</h2>
            <p class="text-slate-400 text-xs mb-8 font-bold uppercase tracking-wide">Posa els telèfons de confiança (amb prefix 34):</p>
            
            <div class="space-y-4 flex-grow">
                <input type="tel" id="tel1" placeholder="Telèfon 1 (ex: 34600000000)" class="w-full bg-slate-800 border-2 border-slate-700 p-4 rounded-2xl outline-none focus:border-red-500 transition-colors">
                <input type="tel" id="tel2" placeholder="Telèfon 2" class="w-full bg-slate-800 border-2 border-slate-700 p-4 rounded-2xl outline-none focus:border-red-500 transition-colors">
                <input type="tel" id="tel3" placeholder="Telèfon 3" class="w-full bg-slate-800 border-2 border-slate-700 p-4 rounded-2xl outline-none focus:border-red-500 transition-colors">
                <input type="tel" id="tel4" placeholder="Telèfon 4" class="w-full bg-slate-800 border-2 border-slate-700 p-4 rounded-2xl outline-none focus:border-red-500 transition-colors">
            </div>

            <div class="space-y-3">
                <button onclick="guardarConfig()" class="w-full bg-red-600 p-5 rounded-2xl font-black uppercase tracking-widest shadow-lg">Guardar Canvis</button>
                <button onclick="toggleConfig()" class="w-full text-slate-500 font-bold uppercase text-xs py-2">Tornar</button>
            </div>
        </div>

        <footer class="absolute bottom-6 opacity-30 text-[9px] font-black tracking-[0.4em] uppercase">
            NeurekaLAB Security
        </footer>
    </div>

    <script>
        // Carregar números guardats
        window.onload = function() {
            document.getElementById('tel1').value = localStorage.getItem('sos_tel1') || "";
            document.getElementById('tel2').value = localStorage.getItem('sos_tel2') || "";
            document.getElementById('tel3').value = localStorage.getItem('sos_tel3') || "";
            document.getElementById('tel4').value = localStorage.getItem('sos_tel4') || "";
        };

        function toggleConfig() {
            document.getElementById('config-ui').classList.toggle('hidden');
        }

        function guardarConfig() {
            localStorage.setItem('sos_tel1', document.getElementById('tel1').value);
            localStorage.setItem('sos_tel2', document.getElementById('tel2').value);
            localStorage.setItem('sos_tel3', document.getElementById('tel3').value);
            localStorage.setItem('sos_tel4', document.getElementById('tel4').value);
            alert("Números guardats correctament!");
            toggleConfig();
        }

        function executarSOS(tipus) {
            const t1 = localStorage.getItem('sos_tel1');
            const t2 = localStorage.getItem('sos_tel2');
            const t3 = localStorage.getItem('sos_tel3');
            const t4 = localStorage.getItem('sos_tel4');

            if (!t1 && !t2) {
                alert("Primer has de configurar algun número de telèfon!");
                toggleConfig();
                return;
            }

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const mapUrl = `https://www.google.com/maps?q=${lat},${lon}`;
                    const text = `ESTINC EN EMERGÈNCIA. La meva ubicació actual és: ${mapUrl}`;

                    if (tipus === 'sms') {
                        // Enviament massiu SMS
                        const numeros = [t1, t2, t3, t4].filter(t => t !== "").join(
                            /iPad|iPhone|iPod/.test(navigator.userAgent) ? "," : ";"
                        );
                        window.location.href = `sms:${numeros}?body=${encodeURIComponent(text)}`;
                    } else {
                        // WhatsApp (obrim l'app amb el missatge ja escrit per triar el grup o contacte ràpidament)
                        window.location.href = `https://wa.me/?text=${encodeURIComponent(text)}`;
                    }
                }, function() {
                    alert("Error: Activa el GPS del mòbil per enviar l'ubicació.");
                });
            } else {
                alert("GPS no disponible al teu mòbil.");
            }
        }

        // El botó gran de dalt fa l'acció per defecte de WhatsApp
        function enviarUbicacio() { executarSOS('whatsapp'); }
    </script>
</body>
</html>
